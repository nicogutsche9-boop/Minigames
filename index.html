<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b18">
  <title>Mini Arcade</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="settingsButton" class="icon-button" aria-label="Einstellungen">⚙</button>
      <div class="brand-mini">MINI <span>ARCADE</span></div>
      <div class="coin-badge" aria-label="Coins"><span>★</span> <strong id="coinCount">1.250</strong></div>
    </header>

    <main>
      <section id="menuScreen" class="screen active">
        <div class="hero">
          <div class="hero-star">★</div>
          <h1>MINI<br><span>ARCADE</span></h1>
          <p>KLEINE SPIELE. GROSSE SCORES.</p>
        </div>

        <div class="game-grid">
          <button class="game-card featured" data-game="reaction">
            <div class="card-icon">⚡</div>
            <h2>REACTION</h2>
            <p>Wie schnell kannst du reagieren?</p>
            <span class="play-pill">SPIELEN</span>
          </button>

          <button class="game-card disabled" disabled>
            <div class="card-icon pink">🧠</div>
            <h2>MEMORY</h2>
            <p>Finde alle Kartenpaare.</p>
            <span class="soon-pill">BALD VERFÜGBAR</span>
          </button>

          <button class="game-card disabled" disabled>
            <div class="card-icon green">🐍</div>
            <h2>SNAKE</h2>
            <p>Der Klassiker. Wachse und überlebe.</p>
            <span class="soon-pill">BALD VERFÜGBAR</span>
          </button>
        </div>

        <nav class="bottom-nav">
          <button id="highscoreButton">🏆 HIGHSCORES</button>
          <button id="myGamesButton">🎮 MEINE SPIELE</button>
        </nav>
      </section>

      <section id="reactionScreen" class="screen">
        <div class="game-topbar">
          <button id="reactionMenuButton" class="back-button">← <span>Menü</span></button>
          <h2>⚡ REACTION</h2>
          <button id="soundButton" class="icon-button" aria-label="Sound an/aus">🔊</button>
        </div>

        <div class="stats">
          <div class="stat-card">
            <span>🏆 PUNKTE</span>
            <strong id="scoreValue">0</strong>
          </div>
          <div class="stat-card time">
            <span>◷ ZEIT</span>
            <strong><span id="timeValue">30</span>s</strong>
          </div>
        </div>

        <div id="reactionArena" class="arena">
          <div id="reactionIntro" class="arena-overlay">
            <div class="intro-icon">⏱</div>
            <h3>BEREIT?</h3>
            <p>Klicke so schnell wie möglich auf das Ziel!</p>
            <button id="startReactionButton" class="primary-button">SPIEL STARTEN</button>
          </div>
          <button id="target" class="target hidden" aria-label="Ziel treffen"></button>
        </div>
      </section>

      <section id="gameOverScreen" class="screen game-over">
        <div class="confetti" aria-hidden="true">✦　◆　•　★　◇　✦　•　◆　★</div>
        <div class="trophy">🏆</div>
        <h2>GAME OVER</h2>
        <p class="score-label">DEIN SCORE</p>
        <div id="finalScore" class="final-score">0</div>
        <p id="highscoreMessage" class="highscore-message">★ NEUER HIGHSCORE! ★</p>
        <button id="playAgainButton" class="primary-button">↻ &nbsp; NOCHMAL SPIELEN</button>
        <button id="gameOverMenuButton" class="secondary-button">⌂ &nbsp; ZUM MENÜ</button>
      </section>

      <section id="highscoreScreen" class="screen simple-screen">
        <button id="highscoreBackButton" class="back-button">← Menü</button>
        <h2>🏆 HIGHSCORES</h2>
        <div class="highscore-panel">
          <p>⚡ Reaction</p>
          <strong id="storedHighscore">0</strong>
          <small>Dein bester Score</small>
        </div>
      </section>

      <section id="settingsScreen" class="screen simple-screen">
        <button id="settingsBackButton" class="back-button">← Menü</button>
        <h2>⚙ EINSTELLUNGEN</h2>
        <div class="settings-panel">
          <label class="setting-row">
            <span>Sound</span>
            <input id="soundToggle" type="checkbox" checked>
          </label>
          <button id="resetScoreButton" class="secondary-button">Highscore zurücksetzen</button>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
